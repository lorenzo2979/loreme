name: GW006 REV16 - APConfig provision parser native build (NO FLASH)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-native-rev16.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Host parser and regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make bc python3 git curl wget unzip bzip2 lib32z1 lib32stdc++6 libssl-dev
          make test
          make test-sdk-integration
      - name: Clone official Realtek AmebaD SDK
        run: |
          git clone --depth 1 https://github.com/Ameba-AIoT/ameba-rtos-d.git "$RUNNER_TEMP/ameba-rtos-d"
          git -C "$RUNNER_TEMP/ameba-rtos-d" rev-parse HEAD > sdk_commit.txt
      - name: Integrate REV16 safely into KM4
        run: |
          python3 scripts/audit_sdk.py "$RUNNER_TEMP/ameba-rtos-d" --output sdk_audit.json
          python3 scripts/integrate_amebad_sdk.py --sdk "$RUNNER_TEMP/ameba-rtos-d" --apply
          grep -q 'gwir_apconfig_provision.c' "$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/src/src_hp/Makefile"
          grep -q 'gwir_apconfig_session.c' "$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/src/src_hp/Makefile"
          grep -q 'gwir_sdk_apconfig_wifi.c' "$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/src/src_hp/Makefile"
      - name: Native KM0
        run: |
          mkdir -p native_logs
          sdk="$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/GCC-RELEASE"
          set +e; timeout 1200s make -C "$sdk/project_lp" all > native_logs/km0.log 2>&1; rc=$?; set -e
          echo "KM0_EXIT=$rc" > native_logs/RESULTS.txt
          exit "$rc"
      - name: Native KM4
        run: |
          sdk="$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/GCC-RELEASE"
          set +e; timeout 1500s make -C "$sdk/project_hp" all > native_logs/km4.log 2>&1; rc=$?; set -e
          echo "KM4_EXIT=$rc" >> native_logs/RESULTS.txt
          grep -F 'gwir_apconfig_provision.c' native_logs/km4.log > native_logs/provision_compile_hit.txt || true
          if [ "$rc" -eq 0 ]; then test -s native_logs/provision_compile_hit.txt || exit 42; fi
          exit "$rc"
      - name: Upload logs only - no firmware binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gw006-rev16-apconfig-provision-logs
          path: |
            sdk_commit.txt
            sdk_audit.json
            native_logs/
          retention-days: 14
