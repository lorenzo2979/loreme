name: ALBATROS Distillation Smoke
on:
  push:
    branches: [albatros-neural-distillation-it]
    paths: ['albatros-distillation/**', '.github/workflows/albatros-distillation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: OMP_NUM_THREADS=2 python albatros-distillation/smoke.py
