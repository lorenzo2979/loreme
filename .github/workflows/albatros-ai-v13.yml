name: ALBATROS AI V1.3 - Python tests
on:
  push:
    branches: [albatros-ai-v1-3]
    paths:
      - 'albatros-ai-v1-3/**'
      - '.github/workflows/albatros-ai-v13.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: albatros-ai-v1-3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check source files
        run: test -f agent.py && test -d tests
      - name: Compile source
        run: python -m compileall -q agent.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline self-check
        run: python agent.py --self-check
