name: ALBATROS Intelligent Audio Supervisor
on:
  push:
    branches: [albatros-ai-v1-3]
    paths:
      - 'albatros-multi-stt-v2/audio_supervisor.py'
      - 'albatros-multi-stt-v2/audio_supervisor_benchmark.py'
      - 'albatros-multi-stt-v2/tests/test_audio_supervisor.py'
      - '.github/workflows/albatros-audio-supervisor.yml'
  workflow_dispatch:
jobs:
  supervisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: albatros-multi-stt-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libraries
        run: |
          python -m pip install numpy==2.2.6 scipy faster-whisper==1.1.1 'requests>=2.32,<3' pyarrow sherpa-onnx webrtc-noise-gain==1.2.3
          sudo apt-get update
          sudo apt-get install -y ffmpeg autoconf automake libtool pkg-config
      - name: Verify supervisor invariants
        run: python -m unittest discover -s tests -p test_audio_supervisor.py
      - name: Prepare models
        run: |
          mkdir -p audio-models
          for model in gtcrn_simple.onnx dpdfnet_baseline.onnx; do
            curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/$model" -o "audio-models/$model"
          done
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx -o audio-models/silero_vad.onnx
          curl -fL --retry 3 https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl -o /tmp/deep-filter
          chmod +x /tmp/deep-filter
          echo DEEP_FILTER_BIN=/tmp/deep-filter >> "$GITHUB_ENV"
          git clone --depth 1 --branch v0.1 https://github.com/xiph/rnnoise.git /tmp/rnnoise
          cd /tmp/rnnoise
          ./autogen.sh
          ./configure
          make -j2
          echo RNNOISE_LIB=/tmp/rnnoise/.libs/librnnoise.so >> "$GITHUB_ENV"
      - name: Benchmark development and independent data
        run: python -u audio_supervisor_benchmark.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supervisor-evaluation
          path: |
            albatros-multi-stt-v2/supervisor-dev.json
            albatros-multi-stt-v2/supervisor-result.json
          if-no-files-found: warn
