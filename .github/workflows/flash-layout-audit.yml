name: GW006 CP19 flash layout audit (HOST ONLY - NO FLASH)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_gw006_flash_map.py'
      - 'tests/test_flash_map_audit.py'
      - '.github/workflows/flash-layout-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only synthetic map and backup validation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_flash_map_audit.py
      - name: Safety boundary
        run: |
          echo "No hardware, no firmware image, no flash or serial operation"
          echo "An audit PASS does not authorize programming the GW006."
