name: GW006 REV11 - AmebaD native SDK + half duplex (NO FLASH)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sdk-native-rev11.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Host core tests and mock SDK
        run: |
          make test
          make test-sdk-integration
      - name: Install SDK build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq make bc python3 git curl wget unzip bzip2 lib32z1 lib32stdc++6
      - name: Clone Realtek AmebaD SDK
        run: |
          git clone --depth 1 https://github.com/Ameba-AIoT/ameba-rtos-d.git "$RUNNER_TEMP/ameba-rtos-d"
          git -C "$RUNNER_TEMP/ameba-rtos-d" rev-parse HEAD > sdk_commit.txt
      - name: Inject GW006 REV11 into KM4 project
        run: |
          python3 scripts/audit_sdk.py "$RUNNER_TEMP/ameba-rtos-d" --output sdk_audit.json
          python3 scripts/integrate_amebad_sdk.py --sdk "$RUNNER_TEMP/ameba-rtos-d" --dry-run
          python3 scripts/integrate_amebad_sdk.py --sdk "$RUNNER_TEMP/ameba-rtos-d" --apply
          grep -q 'gwir_amebad_bus.c' "$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/src/src_hp/Makefile"
          grep -q 'gwir_amebad_vendor_bus.c' "$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/src/src_hp/Makefile"
      - name: Native KM0 build
        shell: bash
        run: |
          mkdir -p native_logs
          sdk="$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/GCC-RELEASE"
          set +e
          timeout 1200s make -C "$sdk/project_lp" all > native_logs/km0.log 2>&1
          code=$?
          set -e
          echo "KM0_EXIT=$code" > native_logs/RESULTS.txt
          exit "$code"
      - name: Native KM4 build with bus coordinator
        shell: bash
        run: |
          sdk="$RUNNER_TEMP/ameba-rtos-d/project/realtek_amebaD_va0_example/GCC-RELEASE"
          set +e
          timeout 1500s make -C "$sdk/project_hp" all > native_logs/km4.log 2>&1
          code=$?
          set -e
          echo "KM4_EXIT=$code" >> native_logs/RESULTS.txt
          grep -E 'gwir_amebad_bus.c|gwir_amebad_vendor_bus.c' native_logs/km4.log > native_logs/bus_build_hits.txt || true
          if [ "$code" -eq 0 ]; then test -s native_logs/bus_build_hits.txt || exit 42; fi
          exit "$code"
      - name: Upload LOGS ONLY (never firmware binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gw006-rev11-native-sdk-logs
          path: |
            sdk_commit.txt
            sdk_audit.json
            native_logs/
          retention-days: 14
