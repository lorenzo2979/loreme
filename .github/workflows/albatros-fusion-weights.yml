name: ALBATROS Fusion Weights
on:
  push:
    branches: [albatros-neural-fusion-it]
    paths:
      - 'albatros-neural-fusion/merge.py'
      - '.github/workflows/albatros-fusion-weights.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: albatros-fusion-weights
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          df -h
          free -h
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 accelerate safetensors huggingface_hub
      - run: python -u albatros-neural-fusion/merge.py
      - uses: actions/upload-artifact@v4
        with:
          name: albatros-fusion-it-v1
          path: fusion-output/
          retention-days: 3
          compression-level: 0
