name: ALBATROS V8 audio robustness
on:
  push:
    paths:
      - '.github/workflows/albatros-v8-audio.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.51.3 datasets==3.6.0 soundfile librosa scipy
      - name: Paired clean and noisy evaluation
        run: |
          python -u - <<'PY'
          import json,re,numpy as np,torch
          from scipy.signal import stft,istft
          from datasets import load_dataset,Audio
          from transformers import WhisperProcessor,WhisperForConditionalGeneration
          torch.set_num_threads(2)
          rng=np.random.default_rng(42)
          p=WhisperProcessor.from_pretrained("openai/whisper-small")
          m=WhisperForConditionalGeneration.from_pretrained("openai/whisper-small").eval()
          def words(s): return re.findall(r"[^\W_]+",s.lower())
          def dist(a,b):
              d=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  e=[i]
                  for j,y in enumerate(b,1): e.append(min(e[-1]+1,d[j]+1,d[j-1]+(x!=y)))
                  d=e
              return d[-1]
          def clean(a):
              _,_,z=stft(a,16000,nperseg=512,noverlap=384)
              mag=np.abs(z)
              floor=np.quantile(mag,.2,axis=1,keepdims=True)
              gain=np.clip(1-1.5*floor/(mag+1e-8),.2,1)
              _,b=istft(z*gain,16000,nperseg=512,noverlap=384)
              b=b[:len(a)]
              return np.clip(b*min(4,.06/(np.sqrt(np.mean(b*b))+1e-8)),-1,1).astype(np.float32)
          @torch.no_grad()
          def decode(a):
              x=p(a,sampling_rate=16000,return_tensors="pt").input_features
              return p.batch_decode(m.generate(x,language="it",task="transcribe",do_sample=False,max_new_tokens=128),skip_special_tokens=True)[0]
          ds=load_dataset("google/fleurs","it_it",split="test",streaming=True,trust_remote_code=True).cast_column("audio",Audio(sampling_rate=16000))
          totals={}; seen=set()
          for row in ds:
              a=np.asarray(row["audio"]["array"],dtype=np.float32)
              ref=row["transcription"]; w=words(ref)
              if not 16000<=len(a)<=160000 or not w or tuple(w) in seen: continue
              seen.add(tuple(w))
              variants={"clean_raw":a,"clean_filtered":clean(a)}
              for snr in (5,10,20):
                  n=rng.normal(size=len(a)).astype(np.float32)
                  noisy=a+n*np.sqrt(np.mean(a*a)/(np.mean(n*n)+1e-12))*10**(-snr/20)
                  variants[f"noise{snr}_raw"]=noisy
                  variants[f"noise{snr}_filtered"]=clean(noisy)
              result={"reference":ref,"conditions":{}}
              for k,v in variants.items():
                  h=decode(v); e=dist(w,words(h))
                  t=totals.setdefault(k,{"words":0,"errors":0})
                  t["words"]+=len(w);t["errors"]+=e
                  result["conditions"][k]={"hypothesis":h,"errors":e}
              with open("v8-rows.jsonl","a") as f: f.write(json.dumps(result,ensure_ascii=False)+"\n")
              print("Completed",len(seen),flush=True)
              if len(seen)>=32: break
          assert len(seen)>=16
          for t in totals.values(): t["wer"]=t["errors"]/t["words"]
          with open("v8-report.json","w") as f: json.dump({"samples":len(seen),"noise":"synthetic white noise","conditions":totals},f,indent=2)
          print(totals)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: albatros-v8-audio-report
          path: v8-*.json*
