name: GW006 Realtek RTL8721CSM-family AMB21/AMB22 integrated build - NO FLASH
on:
  push:
    branches: [review/gw006-realtek-flash-hal]
    paths:
      - 'firmware/arduino/**'
      - 'firmware/core/gwir_apconfig_controller.*'
      - 'firmware/core/gwir_apconfig_button.*'
      - 'firmware/core/gwir_apconfig_session.*'
      - 'scripts/sync_gw006_arduino_core.py'
      - 'scripts/apply_gw006_storage_abort.py'
      - 'patches/gw006_authenticated_storage_*.patch'
      - 'patches/gw006_authenticated_store_implementation.patch'
      - '.github/workflows/gw006-ameba-arduino-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arduino:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Sync nine actual GWIR C modules and auth STORE patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_gw006_arduino_core.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('firmware/arduino/GW006_Ameba_Probe/src')
          assert len(list(root.glob('gwir_*.c'))) == 24
          assert (root/'gwir_ir_pipeline.c').is_file()
          assert (root/'gwir_apconfig_controller.c').is_file()
          assert (root/'gwir_amebad_rx_irq.c').is_file()
          assert (root/'gwir_amebad_vendor_bus.c').is_file()
          assert (root/'gwir_wbrg1_flash_port.c').is_file()
          assert 'GWIR_STORE_ABORT = 15' in (root/'gwir_protocol.h').read_text()
          assert 'case GWIR_STORE_ABORT:' in (root/'gwir_saved_play_command.c').read_text()
          print('GW006_SOURCE_SYNC_PASS')
          PY
      - uses: arduino/setup-arduino-cli@v2
      - name: Install official Realtek AmebaD Arduino 3.1.9
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/Ameba-AIoT/ameba-arduino-d/master/Arduino_package/package_realtek_amebad_index.json'
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install realtek:AmebaD@3.1.9 --additional-urls "$URL"
      - name: Build AMB21/AMB22 RTL8722CSM sibling reference for WBRG1 RTL8721CSM - NO FLASH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gw006-ameba-arduino
          arduino-cli compile \
            --fqbn 'realtek:AmebaD:Ameba_AMB21_AMB22' \
            --build-path build/gw006-ameba-arduino \
            --verbose \
            firmware/arduino/GW006_Ameba_Probe \
            2>&1 | tee build/gw006-ameba-arduino/build.log
          echo 'ARDUINO_COMPILE_PASS; BOARD_WBRG1_NOT_TESTED; NO_FLASH'
      - name: Verify ELF auth IR NOR HMAC symbols and PSRAM allocation
        shell: bash
        run: |
          set -euo pipefail
          elf=build/gw006-ameba-arduino/application.axf
          test -s "$elf"
          nm="$HOME/.arduino15/packages/realtek/tools/ameba_d_asdk_toolchain/1.0.1/bin/arm-none-eabi-nm"
          "$nm" --defined-only -C "$elf" > build/gw006-ameba-arduino/linked-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('build/gw006-ameba-arduino/linked-symbols.txt').read_text().splitlines()
          data='\n'.join(lines)
          names=(
              'gwir_engine_process', 'gwir_fj_put', 'gwir_saved_play_command',
              'gwir_auth_dispatch_routed', 'gwir_runtime_owner_feed',
              'gw006_ameba_hmac_sha256', 'Gw006AmebaAuthenticatedTcp::poll()',
              'Gw006AmebaRuntime::begin(', 'Gw006AmebaRuntime::poll()',
              'gwir_ir_pipeline_init', 'gwir_wbrg1_flash_port_attach',
              'gwir_apconfig_controller_init', 'gwir_apconfig_controller_poll',
              'gwir_amebad_vendor_board_ir_setup',
          )
          missing=[name for name in names if name not in data]
          if missing: raise SystemExit('ELF missing: '+str(missing))
          addresses=[int(line.split()[0],16) for line in lines if line.endswith(' s_gwir_engine')]
          if len(addresses)!=1 or not 0x02000000 <= addresses[0] < 0x02400000:
              raise SystemExit('GWIR engine not linked into Realtek PSRAM: '+str(addresses))
          print('GW006_ARM_ELF_LINKED_RUNTIME_WIFI_IR_FLASH_HMAC_PSRAM_PASS')
          PY
      - name: Package Realtek KM0/KM4 images for UART boot bench (UNVERIFIED WBRG1)
        shell: bash
        run: |
          set -euo pipefail
          out="build/gw006-rtl8721csm-hardware-bench"
          mkdir -p "$out"
          sdk="$HOME/.arduino15/packages/realtek/tools/ameba_d_tools/1.1.3"
          for name in km0_boot_all.bin km4_boot_all.bin km0_km4_image2.bin; do
            path="$sdk/$name"
            test -s "$path" || { echo "Missing vendor image: $path"; exit 1; }
            cp "$path" "$out/$name"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          dest=Path('build/gw006-rtl8721csm-hardware-bench')
          binaries=sorted(dest.glob('*.bin'))
          assert len(binaries)==3
          manifest={
           'status':'EXPERIMENTAL HARDWARE BRINGUP, NOT VERIFIED GW006',
           'source':'realtek:AmebaD 3.1.9, FQBN Ameba_AMB21_AMB22 RTL8722CSM WBRG1-family reference',
           'chip_target_to_be_verified':'WBRG1 RTL8721CSM',
           'user_firmware':'GW006 IR Universal',
           'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
           'safety':'No automatic device flashing; storage/IR activation requires provisioning and board gates',
           'images':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in binaries}}
          (dest/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          (dest/'READ_ME_FIRST.txt').write_text(
            'GW006 EXPERIMENTAL AMEBAD REFERENCE IMAGES\n'
            'Compiled against WBRG1-family RTL8722CSM reference; NOT boot-tested on this specific GW006.\n'
            'Do not erase flash or program images without confirming UART recovery, '
            'boot headers and image addresses on this board.\n'
            'At present boot provisioning, physical IR, and NOR writing remain disabled.\n'
            'These files exist to inspect and verify the complete KM0/KM4 image set.\n')
          print('GW006_REALTEK_KM0_KM4_IMAGES_PACKAGED=PASS')
          PY
      - name: Upload all three image files for offline bench inspection
        uses: actions/upload-artifact@v4
        with:
          name: gw006-realtek-km0-km4-experimental-boot-inspection
          path: build/gw006-rtl8721csm-hardware-bench/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics only - no flash images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gw006-ameba-arduino-link-diagnostics-only
          path: |
            build/gw006-ameba-arduino/build.log
            build/gw006-ameba-arduino/linked-symbols.txt
          if-no-files-found: warn
          retention-days: 7
