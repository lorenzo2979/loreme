name: GW006 Ameba Arduino integrated auth IR NOR build - board not verified
on:
  push:
    branches: [review/gw006-realtek-flash-hal]
    paths:
      - 'firmware/arduino/**'
      - 'scripts/sync_gw006_arduino_core.py'
      - 'scripts/apply_gw006_storage_abort.py'
      - 'patches/gw006_authenticated_storage_*.patch'
      - 'patches/gw006_authenticated_store_implementation.patch'
      - '.github/workflows/gw006-ameba-arduino-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arduino:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Sync nine actual GWIR C modules and auth STORE patches
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_gw006_arduino_core.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('firmware/arduino/GW006_Ameba_Probe/src')
          assert len(list(root.glob('gwir_*.c'))) == 10
          assert (root/'gwir_wbrg1_flash_port.c').is_file()
          assert 'GWIR_STORE_ABORT = 15' in (root/'gwir_protocol.h').read_text()
          assert 'case GWIR_STORE_ABORT:' in (root/'gwir_saved_play_command.c').read_text()
          print('GW006_SOURCE_SYNC_PASS')
          PY
      - uses: arduino/setup-arduino-cli@v2
      - name: Install official Realtek AmebaD Arduino 3.1.9
        shell: bash
        run: |
          set -euo pipefail
          URL='https://raw.githubusercontent.com/Ameba-AIoT/ameba-arduino-d/master/Arduino_package/package_realtek_amebad_index.json'
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install realtek:AmebaD@3.1.9 --additional-urls "$URL"
      - name: Build official RTL8721DM reference only - not a WBRG1 image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gw006-ameba-arduino
          arduino-cli compile \
            --fqbn 'realtek:AmebaD:SparkFun_ThingPlus-AWCU488' \
            --build-path build/gw006-ameba-arduino \
            --verbose \
            firmware/arduino/GW006_Ameba_Probe \
            2>&1 | tee build/gw006-ameba-arduino/build.log
          echo 'ARDUINO_COMPILE_PASS; BOARD_WBRG1_NOT_TESTED; NO_FLASH'
      - name: Verify ELF auth IR NOR HMAC symbols and PSRAM allocation
        shell: bash
        run: |
          set -euo pipefail
          elf=build/gw006-ameba-arduino/application.axf
          test -s "$elf"
          nm="$HOME/.arduino15/packages/realtek/tools/ameba_d_asdk_toolchain/1.0.1/bin/arm-none-eabi-nm"
          "$nm" --defined-only -C "$elf" > build/gw006-ameba-arduino/linked-symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('build/gw006-ameba-arduino/linked-symbols.txt').read_text().splitlines()
          data='\n'.join(lines)
          names=(
              'gwir_engine_process', 'gwir_fj_put', 'gwir_saved_play_command',
              'gwir_auth_dispatch_routed', 'gwir_runtime_owner_feed',
              'gw006_ameba_hmac_sha256', 'Gw006AmebaAuthenticatedTcp::poll()',
          )
          missing=[name for name in names if name not in data]
          if missing: raise SystemExit('ELF missing: '+str(missing))
          addresses=[int(line.split()[0],16) for line in lines if line.endswith(' s_gwir_engine')]
          if len(addresses)!=1 or not 0x02000000 <= addresses[0] < 0x02400000:
              raise SystemExit('GWIR engine not linked into Realtek PSRAM: '+str(addresses))
          print('GW006_NINE_CORE_MODULES_HMAC_TCP_PSRAM_ELF_PASS')
          PY
      - name: Upload diagnostics only - no flash images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gw006-ameba-arduino-link-diagnostics-only
          path: |
            build/gw006-ameba-arduino/build.log
            build/gw006-ameba-arduino/linked-symbols.txt
          if-no-files-found: warn
          retention-days: 7
