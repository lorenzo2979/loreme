name: ALBATROS Audio Agent paired benchmark
on:
  push:
    branches: [albatros-ai-v1-3]
    paths:
      - 'albatros-multi-stt-v2/audio_agent_benchmark.py'
      - '.github/workflows/albatros-audio-agent-benchmark.yml'
  workflow_dispatch:
jobs:
  paired-italian:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: albatros-multi-stt-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned DSP and recognizer
        run: python -m pip install numpy==2.2.6 faster-whisper==1.1.1 'requests>=2.32,<3'
      - name: Verify recognizer imports
        run: python -c "import requests; from faster_whisper import WhisperModel; import audio_agent"
      - name: Paired comparison
        env:
          WHISPER_MODEL: base
        run: python -u audio_agent_benchmark.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-agent-benchmark
          path: albatros-multi-stt-v2/audio-agent-benchmark.json
