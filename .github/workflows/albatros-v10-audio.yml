name: ALBATROS V10 audio robustness
on:
  push:
    paths:
      - '.github/workflows/albatros-v10-audio.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.51.3 datasets==3.6.0 soundfile librosa scipy
      - name: Paired clean and noisy evaluation
        run: |
          python -u - <<'PY'
          import json,re,numpy as np,torch
          from scipy.signal import stft,istft,butter,sosfilt
          from datasets import load_dataset,Audio
          from transformers import WhisperProcessor,WhisperForConditionalGeneration
          torch.set_num_threads(2)
          rng=np.random.default_rng(42)
          p=WhisperProcessor.from_pretrained("openai/whisper-small")
          m=WhisperForConditionalGeneration.from_pretrained("openai/whisper-small").eval()
          m.generation_config.forced_decoder_ids=None
          def words(s): return re.findall(r"[^\W_]+",s.lower())
          def dist(a,b):
              d=list(range(len(b)+1))
              for i,x in enumerate(a,1):
                  e=[i]
                  for j,y in enumerate(b,1): e.append(min(e[-1]+1,d[j]+1,d[j-1]+(x!=y)))
                  d=e
              return d[-1]
          def clean(a,strength=1.5):
              _,_,z=stft(a,16000,nperseg=512,noverlap=384)
              mag=np.abs(z)
              floor=np.quantile(mag,.2,axis=1,keepdims=True)
              gain=np.clip(1-strength*floor/(mag+1e-8),.2,1)
              _,b=istft(z*gain,16000,nperseg=512,noverlap=384)
              b=b[:len(a)]
              return np.clip(b*min(4,.06/(np.sqrt(np.mean(b*b))+1e-8)),-1,1).astype(np.float32)
          @torch.no_grad()
          def decode(a):
              x=p(a,sampling_rate=16000,return_tensors="pt",return_attention_mask=True)
              return p.batch_decode(m.generate(x.input_features,attention_mask=x.attention_mask,language="it",task="transcribe",do_sample=False,max_new_tokens=128),skip_special_tokens=True)[0]
          def apply(a,k):
              if k==0: return a
              if k==1.5: return clean(a)
              if k==2: return sosfilt(butter(2,100,fs=16000,btype="highpass",output="sos"),a).astype(np.float32)
              _,_,z=stft(a,16000,nperseg=512,noverlap=384)
              power=np.abs(z)**2
              floor=np.quantile(power,.2,axis=1,keepdims=True)
              gain=np.clip(1-floor/(power+1e-12),.25,1)
              _,b=istft(z*gain,16000,nperseg=512,noverlap=384)
              return b[:len(a)].astype(np.float32)
          def feature(a):
              _,_,z=stft(a,16000,nperseg=512,noverlap=384)
              mag=np.abs(z)
              ratio=np.sum(np.quantile(mag,.2,axis=1)**2)/(np.mean(np.sum(mag**2,axis=0))+1e-12)
              return min(3,int(np.searchsorted([.015,.06,.18],ratio)))
          def samples(split,limit,excluded):
              ds=load_dataset("google/fleurs","it_it",split=split,streaming=True,trust_remote_code=True).cast_column("audio",Audio(sampling_rate=16000))
              seen=set()
              for row in ds:
                  a=np.asarray(row["audio"]["array"],dtype=np.float32)
                  ref=row["transcription"]; w=words(ref); key=tuple(w)
                  if not 16000<=len(a)<=160000 or not w or key in seen or key in excluded: continue
                  seen.add(key)
                  yield a,ref
                  if len(seen)>=limit: break
              if len(seen)<limit: raise RuntimeError(f"Insufficient {split}: {len(seen)}")
          def variants(a):
              yield "clean",a
              for snr in (5,10,20):
                  n=rng.normal(size=len(a)).astype(np.float32)
                  yield f"noise{snr}",a+n*np.sqrt(np.mean(a*a)/(np.mean(n*n)+1e-12))*10**(-snr/20)
          strengths=[0,1.5,2,3]
          scores=np.zeros((4,4),dtype=int)
          counts=np.zeros(4,dtype=int)
          excluded=set()
          for a,ref in samples("validation",24,set()):
              w=words(ref); excluded.add(tuple(w))
              for condition,v in variants(a):
                  b=feature(v); counts[b]+=1
                  for i,k in enumerate(strengths):
                      scores[b,i]+=dist(w,words(decode(apply(v,k))))
              print("Validation",len(excluded),flush=True)
          policy=[strengths[int(np.argmin(scores[b]))] if counts[b]>=8 else 0 for b in range(4)]
          with open("v10-policy.json","w") as f: json.dump({"policy":policy,"counts":counts.tolist(),"errors":scores.tolist()},f)
          rng=np.random.default_rng(202610)
          totals={}; ntest=0
          for a,ref in samples("test",32,excluded):
              w=words(ref); ntest+=1
              for condition,v in variants(a):
                  b=feature(v); k=policy[b]
                  raw=decode(v); fixed=decode(clean(v)); adaptive=raw if k==0 else fixed if k==1.5 else decode(apply(v,k))
                  row={"reference":ref,"condition":condition,"bucket":b,"strength":k,"hypotheses":{}}
                  for label,h in (("raw",raw),("fixed",fixed),("adaptive",adaptive)):
                      e=dist(w,words(h)); t=totals.setdefault(condition+"_"+label,{"words":0,"errors":0})
                      t["words"]+=len(w);t["errors"]+=e
                      row["hypotheses"][label]={"text":h,"errors":e}
                  with open("v10-rows.jsonl","a") as f: f.write(json.dumps(row,ensure_ascii=False)+"\n")
              print("Test",ntest,flush=True)
          for t in totals.values(): t["wer"]=t["errors"]/t["words"]
          with open("v10-report.json","w") as f: json.dump({"samples":ntest,"validation_samples":len(excluded),"policy":policy,"algorithms":{"0":"raw","1.5":"spectral subtraction","2":"highpass","3":"Wiener-like"},"conditions":totals,"noise":"synthetic white noise"},f,indent=2)
          print(totals,flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: albatros-v10-audio-report
          path: v10-*.json*
