name: ALBATROS Distillation WER
on:
  push:
    branches: [albatros-neural-distillation-it]
    paths: ['albatros-distillation/wer_test.py', '.github/workflows/albatros-distillation-wer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.51.3 datasets==3.6.0 soundfile librosa
      - run: python albatros-distillation/wer_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: italian-distillation-evaluation
          path: |
            wer-report.json
            adapter.pt
