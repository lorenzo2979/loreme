name: ALBATROS Multi-STT experimental tests
on:
  push:
    branches: [albatros-multi-stt-v2-experimental, albatros-ai-v1-3]
  workflow_dispatch:
jobs:
  judge-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: albatros-multi-stt-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DSP dependency
        run: python -m pip install numpy==2.2.6
      - name: Compile
        run: python -m compileall -q .
      - name: Test consensus
        run: python -m unittest discover -s tests -v
