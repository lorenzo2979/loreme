name: ALBATROS Audio Agent V2 filter bank
on:
  push:
    branches: [albatros-ai-v1-3]
    paths:
      - 'albatros-multi-stt-v2/audio_filter_bank.py'
      - 'albatros-multi-stt-v2/filter_bank_benchmark.py'
      - '.github/workflows/albatros-filter-bank.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        engine: [albatros_v1, gtcrn, dpdfnet, deepfilternet, rnnoise, webrtc, ffmpeg, agc, silero]
    defaults:
      run:
        working-directory: albatros-multi-stt-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install baseline dependencies
        run: python -m pip install numpy==2.2.6 scipy faster-whisper==1.1.1 'requests>=2.32,<3'
      - name: Prepare Sherpa models
        if: ${{ contains(fromJSON('["gtcrn","dpdfnet","silero"]'), matrix.engine) }}
        run: |
          python -m pip install sherpa-onnx
          mkdir -p audio-models
          case "${{ matrix.engine }}" in
            gtcrn) curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/gtcrn_simple.onnx -o audio-models/gtcrn_simple.onnx ;;
            dpdfnet) curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet_baseline.onnx -o audio-models/dpdfnet_baseline.onnx ;;
            silero) curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx -o audio-models/silero_vad.onnx ;;
          esac
      - name: Install FFmpeg and GStreamer
        if: ${{ contains(fromJSON('["deepfilternet","webrtc","ffmpeg"]'), matrix.engine) }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Prepare DeepFilterNet
        if: matrix.engine == 'deepfilternet'
        run: |
          curl -fL --retry 3 https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl -o /tmp/deep-filter
          chmod +x /tmp/deep-filter
          echo DEEP_FILTER_BIN=/tmp/deep-filter >> "$GITHUB_ENV"
      - name: Build RNNoise
        if: matrix.engine == 'rnnoise'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          git clone --depth 1 --branch v0.1 https://github.com/xiph/rnnoise.git /tmp/rnnoise
          cd /tmp/rnnoise
          ./autogen.sh
          ./configure
          make -j2
          echo RNNOISE_LIB=/tmp/rnnoise/.libs/librnnoise.so >> "$GITHUB_ENV"
      - name: Run paired benchmark
        run: python -u filter_bank_benchmark.py "${{ matrix.engine }}"
      - uses: actions/upload-artifact@v4
        with:
          name: filter-bank-${{ matrix.engine }}
          path: albatros-multi-stt-v2/filter-bank-result.json
